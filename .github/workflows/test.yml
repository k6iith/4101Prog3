name: Run Scheme48 Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install scheme48
        run: sudo apt-get update && sudo apt-get install -y scheme48

      - name: Run tests
        run: bash runtests3

      - name: Show results
        run: cat report.txt
